<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lock Your Eyes — Focus Ball</title>
<style>
  :root { --bg:#14161b; --gold:#f2a93b; --line:#e9e6df; --dim:#8b8f98; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:#fff; font-family:"Segoe UI",Helvetica,Arial,sans-serif; overflow:hidden; user-select:none; }
  #app { height:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; align-items:center; padding:3vh 16px 2vh; }
  h1 { font-size:clamp(18px,4.6vw,26px); font-weight:800; text-align:center; letter-spacing:.2px; }
  h1 b { color:var(--gold); }
  .sub { font-size:11px; color:var(--dim); margin-top:3px; text-align:center; }
  .hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:800; letter-spacing:.5px; margin:2.2vh 4px 1vh; }
  #stage { position:relative; flex:1; width:100%; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:pointer; }
  .foot { font-size:12px; font-weight:800; letter-spacing:.6px; color:var(--gold); text-align:center; margin-top:1.5vh; min-height:18px; }
  .meta { font-size:11px; color:var(--dim); margin-top:4px; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:24px; background:rgba(20,22,27,.82); border-radius:50%; transition:opacity .25s; }
  #overlay.hide { opacity:0; pointer-events:none; }
  #overlay h2 { font-size:clamp(20px,5.5vw,30px); }
  #overlay p { font-size:13px; color:#c9ccd3; max-width:300px; line-height:1.4; }
  button { background:var(--gold); color:#1a1305; border:0; border-radius:999px; padding:12px 28px; font-size:15px; font-weight:800; cursor:pointer; margin-top:6px; }
  button:active { transform:scale(.97); }
</style>
</head>
<body>
<div id="app">
  <h1>Lock your eyes on the <b>ORANGE BALL</b></h1>
  <div class="sub">16-Second Dopamine &amp; Attention Reset</div>
  <div class="hud"><span id="time">TIME 00.0s</span><span id="rank">100% RETAINED</span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h2 id="oTitle">How is your focus?</h2>
      <p id="oText">Watch the orange ball. It turns white — keep tracking it for 16 seconds, then tap where it ended up.</p>
      <button id="go">Start</button>
    </div>
  </div>
  <div class="foot" id="foot">• BRAINROT RECOVERY: DAY 1/7 •</div>
  <div class="meta" id="meta"></div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), go = $('go');
  const DURATION = 16, REVEAL = 2.2;

  let W, H, cx, cy, R, dpr;
  let balls = [], target = 0, phase = 'idle'; // idle | reveal | track | pick | result
  let t = 0, level = 1, best = 0, picked = -1, won = false, last = 0;
  try { best = +localStorage.getItem('focusball-best') || 0; } catch (e) {}

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const oldR = R;
    R = Math.min(W, H) / 2 - 6; cx = W / 2; cy = H / 2;
    if (oldR) balls.forEach(b => { b.x = cx + (b.x - cx) * R / oldR; b.y = cy + (b.y - cy) * R / oldR; b.vx *= R / oldR; b.vy *= R / oldR; b.r = R * 0.052; });
    const o = overlay.style; o.width = o.height = (R * 2) + 'px'; o.right = o.bottom = 'auto'; o.left = (cx - R) + 'px'; o.top = (cy - R) + 'px';
  }
  window.addEventListener('resize', resize);

  // ---------- audio ----------
  let ac;
  function beep(f, d = .09, type = 'sine', v = .08, when = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + when;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.0001, s + d);
      o.connect(g).connect(ac.destination); o.start(s); o.stop(s + d);
    } catch (e) {}
  }

  // ---------- game ----------
  const count = () => Math.min(8 + level, 16);
  const speed = () => R * (.34 + level * .02);

  function newRound() {
    balls = [];
    const n = count(), r = R * 0.052;
    let guard = 0;
    while (balls.length < n && guard++ < 5000) {
      const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * (R - r * 3);
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
      if (balls.some(b => Math.hypot(b.x - x, b.y - y) < r * 3.2)) continue;
      const ang = Math.random() * 6.283, s = speed();
      balls.push({ x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, r });
    }
    target = Math.floor(Math.random() * balls.length);
    t = 0; picked = -1; phase = 'reveal';
    overlay.classList.add('hide');
    $('foot').textContent = '• BRAINROT RECOVERY: DAY 1/7 •';
    beep(660, .12); beep(880, .12, 'sine', .08, .12);
  }

  function step(dt) {
    const k = phase === 'track' ? 1 + (t / DURATION) * 0.9 : 1; // speeds up over time
    const base = speed();
    for (const b of balls) {
      b.x += b.vx * dt * k; b.y += b.vy * dt * k;
      const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy), lim = R - b.r;
      if (d > lim) {
        const nx = dx / d, ny = dy / d, dot = b.vx * nx + b.vy * ny;
        if (dot > 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
        b.x = cx + nx * lim; b.y = cy + ny * lim;
      }
      const sp = Math.hypot(b.vx, b.vy) || 1; // keep speed steady
      b.vx *= base / sp; b.vy *= base / sp;
    }
    for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
      if (d < m && d > 0) {
        const nx = dx / d, ny = dy / d, rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rel > 0) { a.vx -= rel * nx; a.vy -= rel * ny; b.vx += rel * nx; b.vy += rel * ny; }
        const push = (m - d) / 2; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      }
    }
  }

  function rankText() {
    if (t < 3) return '100% RETAINED';
    if (t < 7) return 'TOP 30% KEEP UP';
    if (t < 11) return 'TOP 5% REMAINING';
    return 'TOP 1% ELITE';
  }

  function update(dt) {
    if (phase === 'reveal') {
      step(dt * .35); t += dt;
      if (t >= REVEAL) { phase = 'track'; t = 0; beep(440, .08, 'triangle'); }
    } else if (phase === 'track') {
      const before = Math.floor(t);
      step(dt); t += dt;
      if (Math.floor(t) !== before) beep(300 + t * 12, .04, 'square', .02);
      $('time').textContent = 'TIME ' + (t < 10 ? '0' : '') + t.toFixed(1) + 's';
      $('rank').textContent = rankText();
      if (t >= DURATION) {
        t = DURATION; phase = 'pick';
        $('time').textContent = 'TIME 16.0s';
        $('rank').textContent = 'TAP THE BALL';
        $('foot').textContent = 'DID YOUR ATTENTION HOLD? TAP THE ORANGE BALL';
        beep(520, .15, 'triangle');
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // arena
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#e9e6df';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = '#f2a93b'; ctx.lineWidth = 1.5;
    for (const [a, b] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
      ctx.beginPath();
      ctx.moveTo(cx + a * (R - 6), cy + b * (R - 6)); ctx.lineTo(cx + a * (R + 6), cy + b * (R + 6)); ctx.stroke();
    }
    // balls
    balls.forEach((b, i) => {
      const isT = i === target;
      const orange = (phase === 'reveal' && isT) || phase === 'result' && isT;
      const sp = Math.hypot(b.vx, b.vy) || 1, len = b.r * 2.6;
      ctx.strokeStyle = orange ? '#f2a93b' : 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / sp * len, b.y - b.vy / sp * len); ctx.stroke();
      if (orange) {
        const pulse = (Math.sin(performance.now() / 120) + 1) / 2;
        ctx.strokeStyle = 'rgba(242,169,59,' + (.35 + pulse * .4) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (1.8 + pulse * .8), 0, 6.283); ctx.stroke();
      }
      ctx.fillStyle = orange ? '#f2a93b' : (phase === 'result' && i === picked && !won ? '#e5484d' : '#fff');
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
    });
    if (phase === 'pick') {
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      balls.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.2, 0, 6.283); ctx.fill(); });
    }
  }

  function loop(ts) {
    const dt = Math.min((ts - last) / 1000 || 0, .05); last = ts;
    update(dt); draw(); requestAnimationFrame(loop);
  }

  function pick(ev) {
    if (phase !== 'pick') return;
    const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let bi = -1, bd = 1e9;
    balls.forEach((b, i) => { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; bi = i; } });
    if (bd > R * 0.2) return;
    picked = bi; won = bi === target; phase = 'result';
    const o = overlay;
    if (won) {
      level++; if (level - 1 > best) { best = level - 1; try { localStorage.setItem('focusball-best', best); } catch (e) {} }
      $('oTitle').textContent = 'Locked in! 🎯';
      $('oText').textContent = 'You held focus for all 16 seconds. Next round has ' + count() + ' balls.';
      go.textContent = 'Next level';
      [523, 659, 784].forEach((f, i) => beep(f, .18, 'triangle', .08, i * .1));
    } else {
      $('oTitle').textContent = 'Focus slipped';
      $('oText').textContent = 'The orange ball was the one highlighted. You reached level ' + level + '.';
      level = 1; go.textContent = 'Try again';
      beep(180, .35, 'sawtooth', .06);
    }
    $('meta').textContent = 'Best: level ' + best;
    $('foot').textContent = '• BRAINROT RECOVERY: DAY 1/7 •';
    setTimeout(() => { overlay.classList.remove('hide'); }, 1100);
  }

  cv.addEventListener('pointerdown', pick);
  go.addEventListener('click', newRound);
  window.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && (phase === 'idle' || phase === 'result')) { e.preventDefault(); newRound(); }
  });

  $('meta').textContent = best ? 'Best: level ' + best : '';
  resize();
  // idle decoration
  (function seed() { level = 1; const n = 9, r = R * .052; for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, d = Math.random() * R * .8, s = speed(), g = Math.random() * 6.283; balls.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, vx: Math.cos(g) * s, vy: Math.sin(g) * s, r }); } target = -1; })();
  const idleStep = () => { if (phase === 'idle') step(1 / 60); };
  setInterval(idleStep, 1000 / 60);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
